# Docker / Production Profile with PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/drevenka_db
spring.datasource.username=drevenka_user
spring.datasource.password=drevenka_secret_password
spring.jpa.hibernate.ddl-auto=update
