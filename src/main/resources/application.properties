spring.application.name=drevenka
server.port=8080

# Default Dev Profile: H2 in-memory database with automatic schema generation
spring.datasource.url=jdbc:h2:mem:drevenkadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Docker PostgreSQL Profile (active when SPRING_PROFILES_ACTIVE=docker)
# spring.datasource.url=jdbc:postgresql://localhost:5432/drevenka_db
